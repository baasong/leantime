text.zulip_instructions = "Integrasi ini akan memposting notifikasi pembaruan ke stream dan topik pilihan Anda.<br/>Ikuti petunjuk <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>di sini untuk membuat bot baru</a>. Kemudian tempel informasi ke dalam formulir di sebelah kanan dan klik Simpan."
text.discord_instructions = "Integrasi ini akan memposting notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>di sini untuk membuat webhook baru</a>, kemudian tempel tautan ke dalam kolom di sebelah kanan dan klik Simpan."
