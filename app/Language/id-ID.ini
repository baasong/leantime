text.mattermost_instructions = " Integrasi ini akan memposting notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>di sini untuk mendapatkan URL Webhook Masuk</a> dari Mattermost. Kemudian tempel tautan ke dalam formulir di sebelah kanan dan klik Simpan."
text.slack_instructions = "Integrasi ini akan memposting notifikasi pembaruan ke saluran pilihan Anda.<br/>Ikuti petunjuk <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>di sini untuk mendapatkan URL Webhook Masuk</a> dari Slack. Kemudian tempel tautan ke dalam formulir di sebelah kanan dan klik Simpan."
text.choose_access_for_users = "Centang atau hapus centang pengguna yang ingin Anda tambahkan/hapus. Anda dapat mempelajari lebih lanjut tentang peran di <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
