text.full_lean_canvas_helper_content = "Papan riset lengkap akan memandu Anda melalui seluruh proses validasi ide.<br/>Di halaman ini, Anda akan sekali lagi membahas segmen pelanggan, masalah, solusi Anda (tapi jangan khawatir, jika Anda sudah mengisinya di papan sederhana, Anda akan melihatnya lagi di sini!).<br/>Dari sana, Anda akan beralih ke Proposisi Nilai Jelas (Apa yang Membuat Ide Anda Lebih Baik dari Penawaran Lain?),<br/>Saluran Penjualan (Bagaimana Pelanggan Mendapatkan Solusi Anda?)<br/>Aliran Pendapatan (Bagaimana solusi Anda menghasilkan uang?)<br/>Struktur Biaya (Berapa Nilai Solusi Anda?) Metrik Kunci (Bagaimana Anda Mengukur Keberhasilan?)<br/>dan keunggulan tidak adil (Apa yang membantu Anda menonjol dari pesaing?)<br/>Menjawab pertanyaan-pertanyaan ini dirancang untuk mendorong kesuksesan, mengurangi kegagalan, dan memungkinkan Anda melacak dan memvalidasi asumsi Anda.<br/>Lean adalah tentang menghilangkan pemborosan dan bekerja untuk membangun produk, toko, dan solusi yang dibutuhkan pelanggan Anda."
