## Pesan Strategi

# Judul
headline.sm.board = "Papan Pesan Strategi"

# Label Elemen/Kotak
box.sm.qa = "Siapa <em>segmen pelanggan yang ditargetkan</em> dan siapa yang <em>secara eksplisit di luar cakupan</em>?"
box.sm.qb = "<em>Proposisi nilai</em> apa yang akan Anda tawarkan kepada pelanggan yang Anda targetkan?"
box.sm.qc = "Mengapa pelanggan harus memilih untuk berbisnis dengan Anda, bukan dengan pesaing Anda? Apa <em>karakteristik khas</em> kami yang sulit ditiru?"
box.sm.qd = "Mengapa Anda akan dapat memenuhi janji yang dibuat kepada pelanggan Anda? <em>Kapabilitas unik</em> apa yang Anda miliki dan manfaatkan?"
