text.timer_on_todo = "<span class='head-icon fa fa-stop'></span> %1$s Timer pada %2$s"
text.these_are_system_wide_settings = "Ini adalah pengaturan seluruh sistem yang akan memengaruhi tampilan & nuansa pengalaman leantime Anda."
text.company_name_helper = "Muncul di judul halaman dan di email"
text.advanced_boards_helper_content = "Ide-ide berevolusi, tumbuh, dan matang. Ini adalah tempat untuk melacaknya.<br/>Pindahkan kartu ide dari satu kolom ke kolom berikutnya untuk mencerminkan keadaan saat ini.<br/>Ini adalah tempat yang baik untuk memulai riset, mengembangkan prototipe, dan memvalidasi prototipe ini dengan beberapa pelanggan sebelum Anda mulai mengimplementasikan."
text.backlog_helper_content = "Backlog adalah rumah bagi semua tugas Anda; yang sedang Anda kerjakan saat ini dan yang akan Anda kerjakan.<br/><br/>Untuk membuat kemajuan dalam menyelesaikan backlog Anda, kami merekomendasikan bekerja dalam iterasi singkat - Sprint.<br/>Sprint adalah interval waktu dua minggu yang memungkinkan Anda fokus pada potongan pekerjaan yang lebih kecil dan dapat dikirim.<br/>Di akhir dua minggu, Anda harus memiliki sesuatu untuk 'didemo'. Sesuatu yang memberikan nilai bagi pengguna atau klien Anda.<br/><br/>Di layar ini, Anda akan dapat mengatur dan mengelola daftar tugas Anda, memprioritaskan backlog Anda melalui seret dan lepas, dan memindahkan item Backlog ke Sprint Anda saat ini.<br/>Ingin info lebih lanjut? Mulai tur atau tutup untuk memulai!"
text.glad_youre_here = "Kami senang Anda di sini. Mari kita luangkan waktu sejenak untuk berkenalan."
text.business_research_section = "Bagian Riset Bisnis kami adalah rumah baru bagi ide-ide Anda. Bagian ini dirancang untuk membawa Anda melalui langkah-langkah pengembangan pelanggan, riset masalah, dan ideasi solusi."
text.our_roadmap_design = "Peta jalan kami dirancang untuk membawa Anda dari milestone yang lebih kecil dan dapat dikelola ke penyelesaian gambaran besar. Rencanakan milestone sekitar 3 bulan dan gunakan penanda proyek ini untuk tetap pada target."
text.this_is_where_you_spend_most_time = "Di sinilah Anda akan menghabiskan sebagian besar waktu Anda - melakukan. Rencanakan Sprint 2 minggu Anda dan laksanakan dengan sukses dengan Papan Kanban dan alat Backlog kami. Gunakan Retrospektif untuk berkembang untuk Sprint berikutnya."
text.idea_board_helper_content = "Ini adalah tempat untuk mengumpulkan semua ide Anda. Diskusikan yang baru dengan tim Anda dan lampirkan Milestone untuk melihat kemajuan menuju ide-ide Anda."
text.kanban_helper_content = "Kanban adalah kata dalam bahasa Jepang untuk 'kartu'. Papan Kanban dimulai oleh insinyur Toyota pada tahun 40-an dengan manufaktur Lean.<br/>Ini digunakan untuk berbagi informasi dan kemajuan kerja secara visual dengan cepat.<br/>Papan Kanban berguna untuk memvisualisasikan pekerjaan dan status, untuk membantu mengelola pekerjaan yang aktif atau sedang berlangsung, mengelola alur kerja dan bertindak cepat menuju perbaikan lean."
text.my_timesheets_helper_content = "Lembar Waktu adalah tempat untuk melacak jam kerja aktual pada sebuah Tugas.<br/>Ini berguna untuk tujuan penagihan tetapi juga untuk memvalidasi seberapa baik Anda merencanakan tugas Anda di awal.<br/>Seiring waktu, Leantime dapat menyesuaikan tanggal jatuh tempo untuk memperhitungkan ketidaksesuaian perencanaan."
text.new_project_helper_content = "<p>Ini adalah tempat Anda akan mendeskripsikan, mendefinisikan, dan menetapkan parameter untuk proyek Anda. Ini penting karena ini adalah bagian yang mengkomunikasikan kepada<br/>seluruh tim apa prioritas, harapan, dan pedoman proyek itu.</p><p><br/><em>Hal-hal yang perlu dipikirkan di sini: 4C.<br/>Jelas, Ringkas, Lengkap, dan Kredibel.<br/><br/></em></p><p>Menguasai hal-hal ini dalam deskripsi proyek Anda membuat semua orang berada di halaman yang sama dan membantu meminimalkan risiko kesalahan atau langkah yang salah.</p><br/>Saatnya memulai!<br/><br/>"
text.not_found_helper_content = "<p>Kami belum memiliki konten untuk halaman ini.<br/>Silakan gunakan tautan 'Butuh Bantuan' kami di bagian bawah untuk mempelajari lebih lanjut tentang hal-hal yang dapat Anda lakukan di sini.</p>"
text.retros_helper_content = "<p>Retrospektif adalah refleksi cepat tentang pekerjaan, fungsi tim, dan tentu saja kemajuan.<br/>Di sinilah tim Anda dapat meluangkan waktu sejenak untuk fokus pada apa yang berjalan baik, apa yang tidak berjalan baik, dan apa yang bisa dilakukan secara berbeda lain kali.<br/>Kami merekomendasikan untuk mengadakan pertemuan tinjauan secara berkala, atau setidaknya, di akhir setiap Milestone.<br/></p>"
text.roadmap_helper_content = "<p>Peta jalan sangat membantu untuk memperkecil proyek besar menjadi potongan-potongan yang lebih kecil dan lebih mudah dikelola.<br/><br/></p><p>Untuk membuat peta jalan Anda, kami merekomendasikan menetapkan milestone yang dapat dicapai dalam rentang waktu 3 bulan.</p><p>Milestone adalah titik pemeriksaan dalam perjalanan menuju penyelesaian proyek.<br/>Secara sederhana: Jika Anda melakukan perjalanan darat lintas negara, maka setiap negara bagian yang Anda lewati bisa menjadi milestone.<br/><br/>Klik 'Tambah Milestone' di sisi kiri atas untuk memulai. Atur tanggal di tab ini atau di bagan peta jalan itu sendiri dengan mengklik dan menyeret milestone di dalam kalender.</p>"
text.show_clients_helper_content = "<p>Klien/Produk mengatur Proyek Anda ke dalam kategori dan memungkinkan Anda untuk mengisolasi grup yang berbeda.<br/><br/></p><p>Sebagai seorang konsultan, Anda sudah bekerja dengan klien dan ini akan menjadi tempat untuk mengaturnya.</p><p>Jika Anda adalah Tim Produk, Anda dapat menggunakan bagian ini untuk mengatur dan mengisolasi departemen Anda (pemasaran, penjualan, operasi, dll).</p>"
text.show_projects_helper_content = "<p>Proyek adalah jantung dari bisnis Anda dan Leantime! Perubahan, pengembangan, tujuan, dan apa pun yang dapat Anda bangun atau impikan akan melibatkan proyek.<br/>Manajemen proyek hanyalah proses untuk memastikan bahwa proyek Anda disampaikan tepat waktu, dengan benar, dan dengan nilai bisnis yang nyata.<br/><br/>Di sinilah Proyek Anda akan berada. Halaman proyek Anda akan memungkinkan Anda membuat proyek, dengan cepat melihat jumlah tugas, jam, anggaran, dan klien yang terkait dengan proyek.<br/><br/>Gunakan halaman ini untuk gambaran umum cepat dari semua proyek Anda.<br/><br/></p>"
text.new_db_version = "Versi baru telah diinstal. Untuk menggunakan Leantime, Anda perlu memperbarui basis data Anda.<br/><br/><strong>Pastikan untuk mencadangkan basis data Anda sebelum melakukan pembaruan ini!</strong><br/>Ini mungkin memakan waktu beberapa menit."
text.update_was_successful = "Pembaruan berhasil, Anda sekarang dapat masuk. <a href='%1$s'>Pergi ke halaman masuk</a>"
