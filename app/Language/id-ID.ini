text.lean.disclaimer = "Kanvas Lean diadaptasi dari <a href='https://strategyzer.com/' target='_blank'>Kanvas Model Bisnis</a> dan dilisensikan di bawah lisensi <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a>"
